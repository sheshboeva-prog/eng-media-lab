<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Media Lab</title>
  <meta name="description" content="Videos, tests and quizzes for learning English." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header">
    <div class="header__inner">
      <a class="brand" href="#/home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16v12H4z" /><path d="m10 10 5 2-5 2z" />
          </svg>
        </span>
        <span class="brand__text">English&nbsp;Media&nbsp;Lab</span>
      </a>

      <div class="header__actions">
        <button id="home-btn" class="icon-btn" type="button" aria-label="Home" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z" />
          </svg>
        </button>
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search library" />
        </div>
      </div>
    </div>

  </header>

  <main id="main" class="main" tabindex="-1">
    <section class="page-head" id="page-head">
      <h1 id="page-title" class="page-head__title">Videos</h1>
      <p id="page-sub" class="page-head__sub">Short lessons to watch and learn from.</p>
    </section>

    <div id="filters" class="filters" role="group" aria-label="Filter by topic"></div>

    <div id="content" class="content"></div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__name">English Media Lab</span>
      <span>Videos open on YouTube. Tests and quizzes run in the page.</span>
    </div>
  </footer>

  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
