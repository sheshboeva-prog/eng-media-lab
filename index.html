<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Media Lab</title>
  <meta name="description" content="Videos, tests and quizzes for learning English." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header">
    <div class="header__inner">
      <a class="brand" href="#/home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16v12H4z" /><path d="m10 10 5 2-5 2z" />
          </svg>
        </span>
        <span class="brand__text">English&nbsp;Media&nbsp;Lab</span>
      </a>

      <div class="header__actions">
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search library" />
        </div>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <div class="tabs__inner">
        <span class="tabs__indicator" aria-hidden="true"></span>
        <button class="tab" role="tab" data-tab="home" aria-selected="true" aria-controls="main">Home</button>
        <button class="tab" role="tab" data-tab="videos" aria-selected="false" aria-controls="main">Videos</button>
        <button class="tab" role="tab" data-tab="tests" aria-selected="false" aria-controls="main">Tests</button>
        <button class="tab" role="tab" data-tab="quizzes" aria-selected="false" aria-controls="main">Quizzes</button>
      </div>
    </nav>
  </header>

  <main id="main" class="main" role="tabpanel" tabindex="-1">
    <section class="page-head">
      <h1 id="page-title" class="page-head__title">Videos</h1>
      <p id="page-sub" class="page-head__sub">Short lessons to watch and learn from.</p>
    </section>

    <div id="filters" class="filters" role="group" aria-label="Filter by topic"></div>

    <div id="content" class="content"></div>
  </main>

  <footer class="footer">
    <p>English Media Lab — template build. Content coming next.</p>
  </footer>

  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
