<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EnglishMediaLab</title>
  <meta name="description" content="An interactive platform for learning English through videos, tests and games." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />
  <style>
/* ---------------------------------------------------------------
   English Media Lab — design tokens
   --------------------------------------------------------------- */
:root {
  /* palette */
  --cream:       #f0e4c8;
  --cream-deep:  #e3d2ad;
  --vanilla:     #e8c765;
  --vanilla-deep:#d4ab3c;
  --vanilla-soft:#f5e6b8;

  --bg:            var(--cream);
  --bg-elevated:   #fdf6e4;
  --surface:       #fbf3df;
  --surface-muted: var(--cream-deep);
  --border:        #d8c69f;
  --border-strong: #bfa878;
  --text:          #241d0d;
  --text-muted:    #635637;
  --accent:        #2f2896;
  --accent-soft:   var(--vanilla-soft);
  --accent-text:   #fdf6e4;
  --ok:   #2c6e4a;
  --no:   #a53b28;
  --shadow-sm: 0 1px 2px rgba(60, 45, 10, .10);
  --shadow-md: 0 5px 18px rgba(60, 45, 10, .14);
  --shadow-lg: 0 24px 60px rgba(45, 33, 5, .30);

  --radius-sm: 10px;
  --radius:    14px;
  --radius-lg: 20px;
  --header-h:  60px;

  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}

/* ---------------------------------------------------------------
   Base
   --------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background-image:
    radial-gradient(70% 46% at 12% -6%, color-mix(in srgb, var(--vanilla) 42%, transparent), transparent 70%),
    radial-gradient(48% 34% at 92% -12%, color-mix(in srgb, var(--vanilla) 26%, transparent), transparent 72%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  padding: 10px 16px;
  background: var(--surface);
  border-radius: 0 0 var(--radius-sm) 0;
  z-index: 100;
}
.skip-link:focus { left: 0; }

/* ---------------------------------------------------------------
   Header
   --------------------------------------------------------------- */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
}

.header__inner,
.main,
.page-head,
.filters,
.footer__inner {
  width: min(1120px, 100% - 40px);
  margin-inline: auto;
}

.header__inner {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: -.01em;
  text-decoration: none;
  color: var(--text);
  white-space: nowrap;
}

.brand__mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-text);
}
.brand__mark svg { width: 17px; height: 17px; }

.header__actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search {
  position: relative;
  display: flex;
  align-items: center;
}
.search__icon {
  position: absolute;
  left: 10px;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}
.search input {
  width: 200px;
  height: 36px;
  padding: 0 12px 0 32px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  transition: width .25s var(--ease), border-color .2s;
}
.search input::placeholder { color: var(--text-muted); }
.search input:focus { width: 260px; outline: none; border-color: var(--accent); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.icon-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .18s var(--ease);
}
.icon-btn:hover { background: var(--surface-muted); }
.icon-btn[aria-current="page"] {
  background: var(--vanilla-deep);
  border-color: var(--vanilla-deep);
  color: #2b2107;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------------------------------------------------------------
   Page head + filters
   --------------------------------------------------------------- */
.main { padding: 32px 0 64px; }

.page-head { margin-bottom: 20px; }
.page-head__title {
  font-family: var(--font-display);
  font-size: clamp(27px, 3.6vw, 34px);
  font-weight: 600;
  letter-spacing: -.015em;
}
.page-head__sub {
  margin-top: 4px;
  color: var(--text-muted);
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.chip {
  height: 32px;
  padding: 0 15px;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* ---------------------------------------------------------------
   Grid + cards
   --------------------------------------------------------------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.grid--list { grid-template-columns: 1fr; gap: 12px; }

.card {
  display: flex;
  color: var(--text);
  text-decoration: none;
  flex-direction: column;
  text-align: left;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  overflow: hidden;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .2s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}
.card:active { transform: translateY(-1px); }

.card__thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--vanilla-deep) 0%, var(--vanilla) 45%, var(--cream-deep) 100%);
  color: var(--text);
  overflow: hidden;
}
.card__thumb::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 90% at 20% 0%, rgba(255, 252, 240, .42), transparent 62%);
  pointer-events: none;
}

.card__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s var(--ease);
}
.card:hover .card__img { transform: scale(1.045); }

.card__thumb--media::after {
  background: linear-gradient(to top, rgba(22, 16, 2, .5) 0%, rgba(22, 16, 2, .12) 34%, transparent 62%);
}

.card__play {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 999px;
  background: rgba(253, 246, 228, .92);
  color: var(--text);
  box-shadow: 0 2px 10px rgba(20, 14, 2, .35);
  transition: transform .28s var(--ease), background .2s;
  z-index: 1;
}
.card:hover .card__play { transform: scale(1.08); }
.card__play svg { width: 18px; height: 18px; margin-left: 2px; }

.card__badge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(24, 18, 5, .82);
  color: #fff;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  z-index: 1;
}

.card__body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px 16px;
}

.card__title {
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.35;
}

.card__desc {
  color: var(--text-muted);
  font-size: 13.5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__desc--lead {
  -webkit-line-clamp: 3;
  color: var(--text);
  font-size: 14px;
}

.card__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 12.5px;
}
.card__channel {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card__meta .dot { flex: none; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }

.tag {
  padding: 1px 8px;
  border-radius: 5px;
  background: var(--vanilla-deep);
  color: #2b2107;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .01em;
}

.card__tag {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 1;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(253, 246, 228, .93);
  color: #2b2107;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .01em;
  box-shadow: 0 2px 8px rgba(20, 14, 2, .28);
}

/* Row card (tests) */
.row {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: border-color .2s, background .2s, transform .2s var(--ease);
}
.row:hover { border-color: var(--border-strong); background: var(--bg-elevated); transform: translateX(2px); }

.row__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--vanilla-deep);
  color: #2b2107;
}
.row__icon svg { width: 19px; height: 19px; }
.row__main { flex: 1; min-width: 0; }
.row__title { display: block; font-weight: 600; letter-spacing: -.01em; }
.row__meta {
  display: block;
  color: var(--text-muted);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row__cta {
  flex: none;
  height: 34px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  font-size: 13.5px;
  font-weight: 550;
  transition: background .18s, color .18s, border-color .18s;
}
.row:hover .row__cta { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

/* Empty state */
.empty {
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 72px 20px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--text-muted);
  text-align: center;
}
.empty strong { color: var(--text); font-weight: 600; }

/* ---------------------------------------------------------------
   Home
   --------------------------------------------------------------- */
.hero {
  padding-bottom: 38px;
  margin-bottom: 40px;
  border-bottom: 1px solid var(--border);
}

.hero__eyebrow {
  color: var(--text-muted);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.hero__title {
  max-width: 17ch;
  margin-top: 16px;
  font-family: var(--font-display);
  font-size: clamp(33px, 5.4vw, 50px);
  font-weight: 500;
  line-height: 1.06;
  letter-spacing: -.02em;
  text-wrap: balance;
}

.hero__lead {
  max-width: 58ch;
  margin-top: 16px;
  color: var(--text-muted);
  font-size: 15.5px;
  line-height: 1.62;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 26px;
}

.sections {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
  gap: 16px;
}

.section {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  text-align: left;
  cursor: pointer;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .2s;
}
.section:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}

.section__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}

.section__icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: var(--vanilla-soft);
  border: 1px solid var(--vanilla-deep);
  font-size: 21px;
  line-height: 1;
}

.section__arrow {
  color: var(--text-muted);
  opacity: .4;
  transition: opacity .22s, transform .28s var(--ease);
}
.section__arrow svg { width: 19px; height: 19px; }
.section:hover .section__arrow { opacity: 1; transform: translateX(3px); }

.section__title {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.section__blurb {
  color: var(--text-muted);
  font-size: 13.5px;
  line-height: 1.62;
}

.section__count {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.motto {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 44px 0 56px;
  padding: 30px 34px;
  border-radius: var(--radius-lg);
  background: linear-gradient(120deg, var(--vanilla-soft), var(--cream-deep));
  border: 1px solid var(--vanilla-deep);
}
.motto__label {
  color: #6a5722;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
}
.motto__line {
  max-width: 30ch;
  font-family: var(--font-display);
  font-size: clamp(21px, 3vw, 28px);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -.015em;
  text-wrap: balance;
  color: #241d0d;
}

.block + .block { margin-top: 48px; }

.block__head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 12px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.block__title {
  font-family: var(--font-display);
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -.015em;
}
.block__of {
  color: var(--text-muted);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.linkish--end { margin-left: auto; }
.linkish--end svg { width: 15px; height: 15px; }

@media (max-width: 640px) {
  .hero__title { max-width: none; }
  .hero__actions .btn { flex: 1 1 auto; }
}

/* ---------------------------------------------------------------
   Game covers
   --------------------------------------------------------------- */
.cover {
  position: relative;
  display: grid;
  align-content: center;
  gap: 6px;
  aspect-ratio: 16 / 10;
  padding: 20px;
  overflow: hidden;
}
.cover__type {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .72;
}
.cover__title {
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.02em;
}
.cover__play {
  position: absolute;
  right: 14px;
  bottom: 14px;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 999px;
  background: rgba(253, 246, 228, .92);
  color: #241d0d;
  box-shadow: 0 2px 10px rgba(20, 14, 2, .3);
  transition: transform .28s var(--ease);
}
.cover__play svg { width: 15px; height: 15px; margin-left: 2px; }
.card:hover .cover__play { transform: scale(1.1); }

.cover--sun  { background: linear-gradient(140deg, #f5e3a6, #e8c765 52%, #d4ab3c); color: #322709; }
.cover--dusk { background: linear-gradient(140deg, #eddec0, #cbb491 54%, #a3884f); color: #2b2107; }
.cover--ink  { background: linear-gradient(140deg, #4f47cf, #2f2896 58%, #241f74); color: #f4f0ff; }
.cover--leaf { background: linear-gradient(140deg, #77ab8b, #3f7f5c 56%, #2c6e4a); color: #f1f7f2; }

/* ---------------------------------------------------------------
   Game player
   --------------------------------------------------------------- */
.player { max-width: 820px; }

.player__intro {
  margin: 6px 0 22px;
  color: var(--text-muted);
}

.game { display: block; }
.game--centre {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.board__status {
  margin-top: 18px;
  color: var(--text-muted);
  font-size: 13.5px;
  text-align: center;
}
.board__status.is-done { color: var(--ok); font-weight: 600; }

.runner__actions--centre { justify-content: center; }

/* --- match up --- */
.match {
  display: grid;
  grid-template-columns: .82fr 1.3fr;
  gap: 12px;
}
.match__col {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.match__item {
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: left;
  line-height: 1.4;
  cursor: pointer;
  transition: border-color .18s, background .18s, opacity .25s, transform .18s var(--ease);
}
.match__col--term .match__item { font-weight: 600; }
.match__item:hover { border-color: var(--border-strong); }
.match__item.is-picked {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
}
.match__item.is-done {
  background: var(--cream-deep);
  border-color: transparent;
  color: var(--text-muted);
  opacity: .55;
  cursor: default;
}
.match__item.is-wrong {
  border-color: var(--no);
  animation: shake .4s;
}

/* --- group sort --- */
.stage { display: grid; place-items: center; }
.stage__card {
  max-width: 36ch;
  padding: 20px 24px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  font-size: 17px;
  line-height: 1.4;
  text-align: center;
}
.stage__done {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
}

.bins {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 22px;
}
.bin {
  display: flex;
  flex-direction: column;
  min-height: 132px;
  padding: 12px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 65%, transparent);
}
.bin__label {
  height: 36px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: background .18s;
}
.bin__label:hover { background: color-mix(in srgb, var(--accent) 86%, #000); }
.bin__items {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.chip-item {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  font-size: 12.5px;
  line-height: 1.35;
}
.chip-item.is-ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.chip-item.is-no {
  border-color: color-mix(in srgb, var(--no) 55%, var(--border));
  color: var(--no);
}
.chip-item.is-no::after { content: " ✕"; font-weight: 700; }
.chip-item.is-ok::after { content: " ✓"; color: var(--ok); font-weight: 700; }

/* --- spin the wheel --- */
.wheel__dial {
  position: relative;
  display: grid;
  place-items: center;
  padding-top: 10px;
}
.wheel {
  border-radius: 50%;
  box-shadow: var(--shadow-md);
}
.wheel__pin {
  position: absolute;
  top: 0;
  z-index: 1;
  width: 0;
  height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 17px solid var(--accent);
  filter: drop-shadow(0 1px 2px rgba(20, 14, 2, .35));
}
.wheel__prompt {
  max-width: 38ch;
  margin-top: 22px;
  font-family: var(--font-display);
  font-size: clamp(19px, 2.6vw, 24px);
  font-weight: 500;
  line-height: 1.32;
  text-align: center;
  color: var(--text-muted);
  text-wrap: balance;
}
.wheel__prompt.is-live { color: var(--text); }

/* --- speaking cards --- */
.speak {
  display: grid;
  place-items: center;
  width: min(100%, 34rem);
  min-height: 200px;
  padding: 30px;
  border: 1px solid var(--vanilla-deep);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--vanilla-soft), var(--cream-deep));
  box-shadow: var(--shadow-sm);
  font-family: var(--font-display);
  font-size: clamp(20px, 3vw, 26px);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -.01em;
  text-align: center;
  text-wrap: balance;
  color: #241d0d;
}
.speak.is-in { animation: liftIn .34s var(--ease); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
@keyframes liftIn {
  from { opacity: 0; transform: translateY(8px); }
}

@media (max-width: 640px) {
  .match { grid-template-columns: 1fr 1fr; gap: 8px; }
  .match__item { padding: 10px 11px; font-size: 13px; }
  .runner__actions--centre { flex-direction: row; }
}

/* ---------------------------------------------------------------
   Test runner
   --------------------------------------------------------------- */
.runner { max-width: 720px; }

.runner__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.linkish {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-muted);
  font-weight: 550;
  cursor: pointer;
  transition: color .18s;
}
.linkish:hover { color: var(--text); }
.linkish svg { width: 16px; height: 16px; }

.runner__step {
  color: var(--text-muted);
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}

.runner__bar {
  height: 4px;
  border-radius: 999px;
  background: var(--cream-deep);
  overflow: hidden;
}
.runner__bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width .4s var(--ease);
}

.runner__q {
  margin: 24px 0 18px;
  font-size: clamp(19px, 2.4vw, 23px);
  font-weight: 650;
  line-height: 1.35;
  letter-spacing: -.02em;
}

.runner__options { display: grid; gap: 10px; }

.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .18s var(--ease);
}
.opt:hover { border-color: var(--border-strong); }
.opt:active { transform: scale(.995); }

.opt__letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--cream-deep);
  font-size: 12.5px;
  font-weight: 650;
  transition: background .18s, color .18s;
}

.opt[aria-pressed="true"] {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}
.opt[aria-pressed="true"] .opt__letter {
  background: var(--accent);
  color: var(--accent-text);
}

.runner__actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.btn {
  height: 40px;
  padding: 0 18px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 550;
  cursor: pointer;
  transition: background .18s, border-color .18s, opacity .18s;
}
.btn:hover { background: var(--bg-elevated); }
.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}
.btn--primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* --- results --- */
.score {
  display: flex;
  align-items: center;
  gap: 26px;
  margin: 10px 0 26px;
  padding: 22px 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.score__ring {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: conic-gradient(var(--ok) calc(var(--pct) * 1%), var(--cream-deep) 0);
}
.score__ring::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: var(--surface);
}
.score__num {
  position: relative;
  font-size: 27px;
  font-weight: 650;
  letter-spacing: -.03em;
}
.score__num small { font-size: 15px; font-weight: 550; color: var(--text-muted); }

.score__line { display: flex; align-items: center; gap: 9px; font-weight: 550; }
.score__dot { width: 9px; height: 9px; border-radius: 50%; }
.score__dot--ok { background: var(--ok); }
.score__dot--no { background: var(--no); }
.score__verdict { margin-top: 8px; color: var(--text-muted); font-size: 13.5px; }

.review {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.review__item {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.review__item.is-ok { border-color: color-mix(in srgb, var(--ok) 32%, var(--border)); }
.review__item.is-no { border-color: color-mix(in srgb, var(--no) 32%, var(--border)); }

.review__mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border-radius: 50%;
  color: #fff;
}
.review__mark svg { width: 13px; height: 13px; stroke-width: 3; }
.is-ok .review__mark { background: var(--ok); }
.is-no .review__mark { background: var(--no); }

.review__body { min-width: 0; }
.review__q { font-weight: 600; line-height: 1.4; margin-bottom: 7px; }
.review__answer {
  display: flex;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.5;
}
.review__answer + .review__answer { margin-top: 3px; }
.review__label {
  flex: none;
  width: 118px;
  padding-top: 2px;
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.review__answer--right { color: var(--ok); font-weight: 550; }
.review__answer--right .review__label { color: var(--ok); opacity: .75; }

@media (max-width: 640px) {
  .score { flex-direction: column; align-items: flex-start; gap: 18px; }
  .runner__actions { flex-direction: column-reverse; }
  .runner__actions .btn { width: 100%; }
  .review__answer { flex-direction: column; gap: 2px; }
  .review__label { width: auto; }
}

/* ---------------------------------------------------------------
   Footer
   --------------------------------------------------------------- */
.footer {
  padding: 26px 0 44px;
  margin-top: 56px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 13px;
}
.footer__inner {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
}
.footer__name { color: var(--text); font-weight: 600; letter-spacing: -.01em; }
.footer__by { font-style: italic; }

/* ---------------------------------------------------------------
   Responsive
   --------------------------------------------------------------- */
@media (max-width: 640px) {
  .header__inner, .main, .page-head, .filters, .footer__inner {
    width: calc(100% - 32px);
  }
  .brand__text { display: none; }
  .search input { width: 150px; }
  .search input:focus { width: 190px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .row { flex-wrap: wrap; }
  .row__cta { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of [].concat(children)) {
    if (child) node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
};

function videoCard(item) {
  const card = el('a', {
    className: 'card',
    href: youtubeWatchUrl(item.id),
    target: '_blank',
    rel: 'noopener noreferrer',
  });
  card.innerHTML = `
    <div class="card__thumb card__thumb--media">
      <img class="card__img" src="${youtubeThumb(item.id)}" alt="" loading="lazy"
           onerror="this.onerror=null;this.src='${youtubeThumbAlt(item.id)}'" />
      <span class="card__tag">${item.topic}</span>
      <span class="card__play">${icon('<path d="m9 7 9 5-9 5z" fill="currentColor" stroke="none" />')}</span>
      <span class="card__badge">${item.duration}</span>
    </div>
    <div class="card__body">
      <h3 class="card__title">${item.title}</h3>
      <p class="card__desc">${item.desc}</p>
      <div class="card__meta">
        <span class="card__channel">${item.channel}</span>
      </div>
    </div>`;
  return card;
}

function testRow(item) {
  const row = el('button', { className: 'row', type: 'button' });
  row.innerHTML = `
    <span class="row__icon">${icon('<path d="M9 5h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" /><path d="M10 10h4M10 14h4" />')}</span>
    <span class="row__main">
      <span class="row__title">${item.title}</span>
      <span class="row__meta">${item.topic} · ${countOf(item)} questions</span>
    </span>
    <span class="row__cta">Start</span>`;
  row.addEventListener('click', () => startTest(item));
  return row;
}

  card.innerHTML = `
    <div class="cover cover--${item.cover}">
      <span class="cover__type">${item.type}</span>
      <span class="cover__title">${item.title}</span>
      <span class="cover__play">${icon('<path d="m9 7 9 5-9 5z" fill="currentColor" stroke="none" />')}</span>
    </div>
    <div class="card__body">
      <p class="card__desc card__desc--lead">${item.intro}</p>
      <div class="card__meta">
        <span class="tag">${item.topic}</span>
        <span class="dot"></span>
        <span>${item.type}</span>
      </div>
    </div>`;
  card.addEventListener('click', () => startGame(item));
  return card;
}

/* ---------------------------------------------------------------
   Render
   --------------------------------------------------------------- */
const datasets = { videos, tests, games };

function matches(item) {
  const q = state.query.trim().toLowerCase();
  const byQuery = !q || `${item.title} ${item.desc ?? ''} ${item.topic} ${item.channel ?? ''} ${item.type ?? ''}`.toLowerCase().includes(q);
  const byTopic = state.topic === 'all' || item.topic === state.topic;
  return byQuery && byTopic;
}

/** Topics are read from the content itself, so a new entry adds its own chip. */
const topicsFor = (tab) => [...new Set(datasets[tab].map((item) => item.topic))].sort();

function renderFilters() {
  const wrap = $('#filters');
  wrap.replaceChildren();
  for (const value of ['all', ...topicsFor(state.tab)]) {
    const chip = el('button', { className: 'chip', type: 'button', textContent: value === 'all' ? 'All topics' : value });
    chip.setAttribute('aria-pressed', String(state.topic === value));
    chip.addEventListener('click', () => {
      state.topic = value;
      renderFilters();
      renderContent();
    });
    wrap.append(chip);
  }
}

function renderContent() {
  const content = $('#content');

  if (state.play) {
    content.replaceChildren(renderPlayer());
    return;
  }

  if (state.run) {
    content.replaceChildren(state.run.done ? renderResults() : renderQuestion());
    return;
  }

  if (state.tab === 'home') {
    content.replaceChildren(renderHome());
    return;
  }

  const items = datasets[state.tab].filter(matches);
  content.replaceChildren();

  if (!items.length) {
    content.append(el('div', {
      className: 'empty',
      innerHTML: '<strong>Nothing here yet</strong><span>Try another topic or clear the search.</span>',
    }));
    return;
  }

  const grid = el('div', { className: state.tab === 'tests' ? 'grid grid--list' : 'grid' });
  const build = { videos: videoCard, tests: testRow, games: gameCard }[state.tab];
  items.forEach((item) => grid.append(build(item)));
  content.append(grid);
}

/* ---------------------------------------------------------------
   Home — the three sections, with a few items from each
   --------------------------------------------------------------- */
const SECTIONS = [
  {
    tab: 'videos', label: 'Videos', unit: 'lessons', mark: '🎥',
    blurb: 'Watch short English-language videos on different topics. Listen carefully '
         + 'and focus on the main ideas, key information, and new vocabulary.',
  },
  {
    tab: 'tests', label: 'Tests', unit: 'topics', mark: '📝',
    blurb: 'Check your understanding after watching the videos. Answer the questions '
         + 'and test your English knowledge, comprehension, and analytical skills.',
  },
  {
    tab: 'games', label: 'Games', unit: 'activities', mark: '🎮',
    blurb: 'Learn English in an enjoyable and interactive way. Complete different '
         + 'language games to practise vocabulary, comprehension, and cognitive skills.',
  },
];

const ARROW = '<path d="M5 12h13M13 6l6 6-6 6" />';

function hero() {
  const node = el('header', { className: 'hero' });
  node.innerHTML = `
    <p class="hero__eyebrow">Interactive English platform</p>
    <h1 class="hero__title">Welcome to EnglishMediaLab!</h1>
    <p class="hero__lead">
      EnglishMediaLab is an interactive platform designed to help students improve
      their English through videos, tests, and educational games.
    </p>
    <div class="hero__actions">
      <button class="btn btn--primary" type="button" data-go="videos">Start watching</button>
      <button class="btn" type="button" data-go="tests">Take a test</button>
    </div>`;
  $$('[data-go]', node).forEach((b) => b.addEventListener('click', () => setTab(b.dataset.go)));
  return node;
}

function sectionCard({ tab, label, unit, blurb, mark }) {
  const card = el('button', { className: 'section', type: 'button' });
  card.innerHTML = `
    <span class="section__top">
      <span class="section__icon" aria-hidden="true">${mark}</span>
      <span class="section__arrow">${icon(ARROW)}</span>
    </span>
    <span class="section__title">${label}</span>
    <span class="section__blurb">${blurb}</span>
    <span class="section__count">${datasets[tab].length} ${unit}</span>`;
  card.addEventListener('click', () => setTab(tab));
  return card;
}

function homeBlock(tab, heading, items, build, listClass) {
  const block = el('section', { className: 'block' });
  block.innerHTML = `
    <div class="block__head">
      <h2 class="block__title">${heading}</h2>
      <span class="block__of">${items.length} of ${datasets[tab].length}</span>
      <button class="linkish linkish--end" type="button">See all ${icon(ARROW)}</button>
    </div>
    <div class="${listClass}"></div>`;
  const list = $(`.${listClass.split(' ')[0]}`, block);
  items.forEach((item) => list.append(build(item)));
  $('.linkish', block).addEventListener('click', () => setTab(tab));
  return block;
}

function howToLearn() {
  const node = el('section', { className: 'motto' });
  node.innerHTML = `
    <p class="motto__label">How to learn</p>
    <p class="motto__line">Learn English through media, challenge your thinking, and enjoy the process!</p>`;
  return node;
}

function renderHome() {
  const frag = document.createDocumentFragment();
  frag.append(hero());

  const sections = el('div', { className: 'sections' });
  SECTIONS.forEach((section) => sections.append(sectionCard(section)));
  frag.append(sections);
  frag.append(howToLearn());

  frag.append(homeBlock('videos', 'Watch', videos.slice(0, 3), videoCard, 'grid'));
  frag.append(homeBlock('tests', 'Test yourself', tests.slice(0, 3), testRow, 'grid grid--list'));
  frag.append(homeBlock('games', 'Play a game', games.slice(0, 3), gameCard, 'grid'));
  return frag;
}

/* ---------------------------------------------------------------
   Game player — the activity runs in the page, nothing navigates away
   --------------------------------------------------------------- */
function startGame(game) {
  state.play = game;
  focusTab('games');
  renderTab();
  $('#main').scrollIntoView({ block: 'start' });
}

function exitGame() {
  state.play = null;
  renderTab();
}

const shuffle = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};

function playerShell(game, body) {
  const wrap = el('section', { className: 'player' });
  wrap.innerHTML = `
    <div class="runner__head">
      <button class="linkish" type="button" data-exit>${icon('<path d="M15 18l-6-6 6-6" />')} All games</button>
      <span class="runner__step">${game.type}</span>
    </div>
    <p class="player__intro">${game.intro}</p>
    <div class="board"></div>`;
  $('[data-exit]', wrap).addEventListener('click', exitGame);
  $('.board', wrap).append(body);
  return wrap;
}

function renderPlayer() {
  const game = state.play;
  const engines = { match: matchGame, sort: sortGame, wheel: wheelGame, cards: cardsGame };
  return playerShell(game, engines[game.kind](game));
}

/* --- match up: click a word, then click its meaning --- */
function matchGame(game) {
  const board = el('div', { className: 'match' });
  const state_ = { picked: null, done: 0, misses: 0 };

  const column = (side, entries) => {
    const col = el('div', { className: `match__col match__col--${side}` });
    entries.forEach(({ text, key }) => {
      const btn = el('button', { className: 'match__item', type: 'button', textContent: text });
      btn.dataset.key = key;
      btn.dataset.side = side;
      btn.addEventListener('click', () => pick(btn));
      col.append(btn);
    });
    return col;
  };

  const status = el('p', { className: 'board__status', textContent: `0 of ${game.pairs.length} matched` });

  function pick(btn) {
    if (btn.classList.contains('is-done')) return;
    if (!state_.picked) {
      state_.picked = btn;
      btn.classList.add('is-picked');
      return;
    }
    if (state_.picked === btn) {
      btn.classList.remove('is-picked');
      state_.picked = null;
      return;
    }
    if (state_.picked.dataset.side === btn.dataset.side) {
      state_.picked.classList.remove('is-picked');
      state_.picked = btn;
      btn.classList.add('is-picked');
      return;
    }

    const first = state_.picked;
    state_.picked = null;
    first.classList.remove('is-picked');

    if (first.dataset.key === btn.dataset.key) {
      [first, btn].forEach((n) => n.classList.add('is-done'));
      state_.done += 1;
      status.textContent = state_.done === game.pairs.length
        ? `All ${game.pairs.length} matched${state_.misses ? ` after ${state_.misses} wrong ${state_.misses === 1 ? 'try' : 'tries'}` : ' first time'}.`
        : `${state_.done} of ${game.pairs.length} matched`;
      if (state_.done === game.pairs.length) status.classList.add('is-done');
    } else {
      state_.misses += 1;
      [first, btn].forEach((n) => {
        n.classList.add('is-wrong');
        setTimeout(() => n.classList.remove('is-wrong'), 420);
      });
    }
  }

  const left = game.pairs.map(([term], i) => ({ text: term, key: String(i) }));
  const right = game.pairs.map(([, meaning], i) => ({ text: meaning, key: String(i) }));
  board.append(column('term', shuffle(left)), column('meaning', shuffle(right)));

  const holder = el('div', { className: 'game' });
  holder.append(board, status, replayButton(game));
  return holder;
}

/* --- group sort: one item at a time, straight into a bin --- */
function sortGame(game) {
  const order = shuffle(game.items.map(([text, group], i) => ({ text, group, i })));
  const holder = el('div', { className: 'game' });
  const bins = el('div', { className: 'bins' });
  const stage = el('div', { className: 'stage' });
  const status = el('p', { className: 'board__status' });
  let at = 0;
  let right = 0;

  const binNodes = game.groups.map((name, gi) => {
    const bin = el('div', { className: 'bin' });
    bin.innerHTML = `<button class="bin__label" type="button">${name}</button><div class="bin__items"></div>`;
    $('.bin__label', bin).addEventListener('click', () => place(gi));
    bins.append(bin);
    return bin;
  });

  function draw() {
    const item = order[at];
    status.textContent = `${at} of ${order.length} sorted`;
    stage.replaceChildren(el('div', { className: 'stage__card', textContent: item.text }));
  }

  function place(choice) {
    if (at >= order.length) return;
    const item = order[at];
    const ok = choice === item.group;
    if (ok) right += 1;
    const chip = el('span', {
      className: `chip-item ${ok ? 'is-ok' : 'is-no'}`,
      textContent: item.text,
    });
    $('.bin__items', binNodes[item.group]).append(chip);
    at += 1;
    if (at < order.length) {
      draw();
    } else {
      stage.replaceChildren(el('p', {
        className: 'stage__done',
        textContent: `${right} of ${order.length} in the right place.`,
      }));
      status.textContent = 'Every card sorted. Wrong ones sit in the group they belonged to.';
      status.classList.add('is-done');
    }
  }

  draw();
  holder.append(stage, bins, status, replayButton(game));
  return holder;
}

/* --- spin the wheel: a prompt to talk about --- */
function wheelGame(game) {
  const holder = el('div', { className: 'game game--centre' });
  const size = 260;
  const slices = game.prompts.length;
  const wheel = el('canvas', { className: 'wheel', width: size * 2, height: size * 2 });
  wheel.style.width = `${size}px`;
  wheel.style.height = `${size}px`;

  const ctx = wheel.getContext('2d');
  const read = (token) => getComputedStyle(document.documentElement).getPropertyValue(token).trim();
  const tints = [read('--vanilla'), read('--cream-deep'), read('--vanilla-deep'), read('--vanilla-soft')];

  const paint = (turn) => {
    const r = size;
    ctx.clearRect(0, 0, size * 2, size * 2);
    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(turn);
    for (let i = 0; i < slices; i += 1) {
      const a0 = (i / slices) * Math.PI * 2;
      const a1 = ((i + 1) / slices) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r - 8, a0, a1);
      ctx.closePath();
      ctx.fillStyle = tints[i % tints.length];
      ctx.fill();
      ctx.strokeStyle = read('--border-strong');
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.rotate((a0 + a1) / 2);
      ctx.fillStyle = '#2b2107';
      ctx.font = '600 34px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), r - 34, 0);
      ctx.restore();
    }
    ctx.restore();
  };

  let turn = 0;
  let spinning = false;
  const prompt = el('p', { className: 'wheel__prompt', textContent: 'Press spin to get a question.' });
  const spin = el('button', { className: 'btn btn--primary', type: 'button', textContent: 'Spin' });

  spin.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    spin.disabled = true;
    prompt.classList.remove('is-live');
    const landing = Math.floor(Math.random() * slices);
    const target = turn + Math.PI * 8 + (Math.PI * 2 - ((landing + 0.5) / slices) * Math.PI * 2) - (turn % (Math.PI * 2)) - Math.PI / 2;
    const from = turn;
    const started = performance.now();
    let settled = false;

    const settle = () => {
      if (settled) return;
      settled = true;
      turn = target;
      paint(turn);
      spinning = false;
      spin.disabled = false;
      spin.textContent = 'Spin again';
      prompt.textContent = `${landing + 1}. ${game.prompts[landing]}`;
      prompt.classList.add('is-live');
    };

    const run = (now) => {
      const t = Math.min((now - started) / 3200, 1);
      turn = from + (target - from) * (1 - Math.pow(1 - t, 4));
      paint(turn);
      if (t < 1) requestAnimationFrame(run);
      else settle();
    };
    requestAnimationFrame(run);
    // frames stop in a hidden tab, so land the wheel either way
    setTimeout(settle, 3400);
  });

  paint(turn);
  const dial = el('div', { className: 'wheel__dial' });
  dial.innerHTML = '<span class="wheel__pin" aria-hidden="true"></span>';
  dial.append(wheel);
  holder.append(dial, prompt, el('div', { className: 'runner__actions runner__actions--centre' }, [spin]));
  return holder;
}

/* --- speaking cards: one prompt at a time --- */
function cardsGame(game) {
  const holder = el('div', { className: 'game game--centre' });
  let deck = shuffle(game.prompts);
  let at = 0;

  const card = el('div', { className: 'speak' });
  const status = el('p', { className: 'board__status' });
  const next = el('button', { className: 'btn btn--primary', type: 'button', textContent: 'Next card' });
  const shuffleBtn = el('button', { className: 'btn', type: 'button', textContent: 'Shuffle' });

  const draw = () => {
    card.textContent = deck[at];
    card.classList.remove('is-in');
    requestAnimationFrame(() => card.classList.add('is-in'));
    status.textContent = `Card ${at + 1} of ${deck.length}`;
    next.textContent = at === deck.length - 1 ? 'Back to the first card' : 'Next card';
  };

  next.addEventListener('click', () => { at = (at + 1) % deck.length; draw(); });
  shuffleBtn.addEventListener('click', () => { deck = shuffle(game.prompts); at = 0; draw(); });

  draw();
  holder.append(card, status, el('div', { className: 'runner__actions runner__actions--centre' }, [shuffleBtn, next]));
  return holder;
}

function replayButton(game) {
  const row = el('div', { className: 'runner__actions runner__actions--centre' });
  const again = el('button', { className: 'btn', type: 'button', textContent: 'Start over' });
  again.addEventListener('click', () => { state.play = game; renderContent(); });
  row.append(again);
  return row;
}

/* ---------------------------------------------------------------
   Test runner
   --------------------------------------------------------------- */
function startTest(test) {
  state.run = { test, index: 0, answers: Array(test.questions.length).fill(null), done: false };
  focusTab('tests');
  renderTab();
  $('#main').scrollIntoView({ block: 'start' });
}

/** Started from the home page, an activity still belongs to its own tab. */
function focusTab(tab) {
  state.tab = tab;
  if (location.hash !== `#/${tab}`) location.hash = `#/${tab}`;
}

function exitTest() {
  state.run = null;
  renderTab();
}

function answerButton(option, i, chosen) {
  const btn = el('button', { className: 'opt', type: 'button' });
  btn.setAttribute('aria-pressed', String(chosen === i));
  btn.innerHTML = `<span class="opt__letter">${LETTERS[i]}</span><span class="opt__text">${option}</span>`;
  btn.addEventListener('click', () => {
    state.run.answers[state.run.index] = i;
    renderContent();
  });
  return btn;
}

function renderQuestion() {
  const { test, index, answers } = state.run;
  const question = test.questions[index];
  const total = test.questions.length;
  const last = index === total - 1;

  const wrap = el('section', { className: 'runner' });
  wrap.innerHTML = `
    <div class="runner__head">
      <button class="linkish" type="button" data-exit>${icon('<path d="M15 18l-6-6 6-6" />')} All tests</button>
      <span class="runner__step">Question ${index + 1} of ${total}</span>
    </div>
    <div class="runner__bar"><span style="width:${(index / total) * 100}%"></span></div>
    <h2 class="runner__q">${question.q}</h2>
    <div class="runner__options"></div>
    <div class="runner__actions">
      <button class="btn" type="button" data-prev ${index === 0 ? 'hidden' : ''}>Back</button>
      <button class="btn btn--primary" type="button" data-next ${answers[index] === null ? 'disabled' : ''}>
        ${last ? 'Finish and see results' : 'Next question'}
      </button>
    </div>`;

  const options = $('.runner__options', wrap);
  question.options.forEach((option, i) => options.append(answerButton(option, i, answers[index])));

  $('[data-exit]', wrap).addEventListener('click', exitTest);
  $('[data-prev]', wrap).addEventListener('click', () => { state.run.index -= 1; renderContent(); });
  $('[data-next]', wrap).addEventListener('click', () => {
    if (last) state.run.done = true;
    else state.run.index += 1;
    renderContent();
  });
  return wrap;
}

function renderResults() {
  const { test, answers } = state.run;
  const total = test.questions.length;
  const correct = answers.filter((a, i) => a === test.questions[i].answer).length;
  const wrong = total - correct;
  const verdict = correct === total ? 'Every answer correct.'
    : correct >= total / 2 ? 'A solid result. Look over what you missed.'
    : 'Worth another go once you have reviewed the answers.';

  const wrap = el('section', { className: 'runner' });
  wrap.innerHTML = `
    <div class="runner__head">
      <button class="linkish" type="button" data-exit>${icon('<path d="M15 18l-6-6 6-6" />')} All tests</button>
    </div>

    <div class="score">
      <div class="score__ring" style="--pct:${(correct / total) * 100}">
        <span class="score__num">${correct}<small>/${total}</small></span>
      </div>
      <div class="score__side">
        <p class="score__line"><span class="score__dot score__dot--ok"></span>${correct} correct</p>
        <p class="score__line"><span class="score__dot score__dot--no"></span>${wrong} wrong</p>
        <p class="score__verdict">${verdict}</p>
      </div>
    </div>

    <ol class="review"></ol>

    <div class="runner__actions">
      <button class="btn" type="button" data-retry>Try again</button>
      <button class="btn btn--primary" type="button" data-exit>Back to tests</button>
    </div>`;

  const list = $('.review', wrap);
  test.questions.forEach((question, i) => {
    const given = answers[i];
    const ok = given === question.answer;
    const item = el('li', { className: `review__item ${ok ? 'is-ok' : 'is-no'}` });
    item.innerHTML = `
      <span class="review__mark">${ok
        ? icon('<path d="M20 6L9 17l-5-5" />')
        : icon('<path d="M6 6l12 12M18 6L6 18" />')}</span>
      <div class="review__body">
        <p class="review__q">${question.q}</p>
        <p class="review__answer">
          <span class="review__label">Your answer</span>
          ${given === null ? '<em>Not answered</em>' : `${LETTERS[given]}. ${question.options[given]}`}
        </p>
        ${ok ? '' : `<p class="review__answer review__answer--right">
          <span class="review__label">Correct answer</span>
          ${LETTERS[question.answer]}. ${question.options[question.answer]}
        </p>`}
      </div>`;
    list.append(item);
  });

  $$('[data-exit]', wrap).forEach((b) => b.addEventListener('click', exitTest));
  $('[data-retry]', wrap).addEventListener('click', () => startTest(test));
  return wrap;
}

function renderTab() {
  const meta = TABS[state.tab];
  const run = state.run;
  const play = state.play;
  const focused = Boolean(run || play) || state.tab === 'home';

  $('#page-title').textContent = play ? play.title : run ? run.test.title : meta.title;
  $('#page-sub').textContent = play ? play.topic
    : run ? `${run.test.topic} · ${countOf(run.test)} questions`
    : meta.sub;
  const name = play ? play.title : run ? run.test.title : meta.title;
  document.title = state.tab === 'home' ? 'EnglishMediaLab' : `${name} — EnglishMediaLab`;

  const atHome = state.tab === 'home' && !run && !play;
  $('#home-btn').setAttribute('aria-current', atHome ? 'page' : 'false');

  $('#page-head').hidden = atHome;
  $('#filters').hidden = focused;
  $('.search').hidden = focused;
  if (!focused) renderFilters();
  renderContent();
}

function setTab(tab, { pushHash = true } = {}) {
  if (!TABS[tab] || tab === state.tab) return;
  state.tab = tab;
  state.topic = 'all';
  state.run = null;
  state.play = null;
  if (pushHash) location.hash = `#/${tab}`;
  renderTab();
}

/* ---------------------------------------------------------------
   Wiring
   --------------------------------------------------------------- */
function init() {
  $('#home-btn').addEventListener('click', () => {
    state.run = null;
    state.play = null;
    if (state.tab === 'home') renderTab();
    else setTab('home');
  });

  $('#search').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderContent();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (state.run || state.play)) { state.run = null; state.play = null; renderTab(); }
  });

  addEventListener('hashchange', () => setTab(location.hash.replace('#/', '') || 'home', { pushHash: false }));

  const initial = location.hash.replace('#/', '');
  state.tab = TABS[initial] ? initial : 'home';
  renderTab();
}

init();
  </script>
