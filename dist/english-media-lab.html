<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Media Lab</title>
  <meta name="description" content="Videos, tests and quizzes for learning English." />
  <style>
/* ---------------------------------------------------------------
   English Media Lab — design tokens
   --------------------------------------------------------------- */
:root {
  /* palette */
  --cream:       #f0e4c8;
  --cream-deep:  #e3d2ad;
  --vanilla:     #e8c765;
  --vanilla-deep:#d4ab3c;
  --vanilla-soft:#f5e6b8;

  --bg:            var(--cream);
  --bg-elevated:   #fdf6e4;
  --surface:       #fbf3df;
  --surface-muted: var(--cream-deep);
  --border:        #d8c69f;
  --border-strong: #bfa878;
  --text:          #241d0d;
  --text-muted:    #635637;
  --accent:        #2f2896;
  --accent-soft:   var(--vanilla-soft);
  --accent-text:   #fdf6e4;
  --ok:   #2c6e4a;
  --no:   #a53b28;
  --shadow-sm: 0 1px 2px rgba(60, 45, 10, .10);
  --shadow-md: 0 5px 18px rgba(60, 45, 10, .14);
  --shadow-lg: 0 24px 60px rgba(45, 33, 5, .30);

  --radius-sm: 10px;
  --radius:    14px;
  --radius-lg: 20px;
  --header-h:  60px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}

/* ---------------------------------------------------------------
   Base
   --------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  padding: 10px 16px;
  background: var(--surface);
  border-radius: 0 0 var(--radius-sm) 0;
  z-index: 100;
}
.skip-link:focus { left: 0; }

/* ---------------------------------------------------------------
   Header
   --------------------------------------------------------------- */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
}

.header__inner,
.tabs__inner,
.main,
.page-head,
.filters,
.footer > p {
  width: min(1120px, 100% - 40px);
  margin-inline: auto;
}

.header__inner {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: -.01em;
  text-decoration: none;
  color: var(--text);
  white-space: nowrap;
}

.brand__mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-text);
}
.brand__mark svg { width: 17px; height: 17px; }

.header__actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search {
  position: relative;
  display: flex;
  align-items: center;
}
.search__icon {
  position: absolute;
  left: 10px;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}
.search input {
  width: 200px;
  height: 36px;
  padding: 0 12px 0 32px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  transition: width .25s var(--ease), border-color .2s;
}
.search input::placeholder { color: var(--text-muted); }
.search input:focus { width: 260px; outline: none; border-color: var(--accent); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.icon-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .18s var(--ease);
}
.icon-btn:hover { background: var(--surface-muted); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 17px; height: 17px; }

/* ---------------------------------------------------------------
   Tabs
   --------------------------------------------------------------- */
.tabs__inner {
  position: relative;
  display: flex;
  gap: 4px;
  padding-bottom: 0;
}

.tab {
  position: relative;
  z-index: 1;
  padding: 12px 4px 14px;
  margin-right: 20px;
  border: 0;
  background: none;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: -.01em;
  cursor: pointer;
  transition: color .2s;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; }

.tabs__indicator {
  position: absolute;
  bottom: 0;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--accent);
  transition: transform .32s var(--ease), width .32s var(--ease);
}

/* ---------------------------------------------------------------
   Page head + filters
   --------------------------------------------------------------- */
.main { padding: 32px 0 64px; }

.page-head { margin-bottom: 20px; }
.page-head__title {
  font-size: clamp(24px, 3.4vw, 30px);
  font-weight: 650;
  letter-spacing: -.025em;
}
.page-head__sub {
  margin-top: 4px;
  color: var(--text-muted);
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.chip {
  height: 32px;
  padding: 0 15px;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* ---------------------------------------------------------------
   Grid + cards
   --------------------------------------------------------------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.grid--list { grid-template-columns: 1fr; gap: 12px; }

.card {
  display: flex;
  color: var(--text);
  text-decoration: none;
  flex-direction: column;
  text-align: left;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  overflow: hidden;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .2s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}
.card:active { transform: translateY(-1px); }

.card__thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--vanilla-deep) 0%, var(--vanilla) 45%, var(--cream-deep) 100%);
  color: var(--text);
  overflow: hidden;
}
.card__thumb::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 90% at 20% 0%, rgba(255, 252, 240, .42), transparent 62%);
  pointer-events: none;
}

.card__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s var(--ease);
}
.card:hover .card__img { transform: scale(1.045); }

.card__thumb--media::after {
  background: linear-gradient(to top, rgba(22, 16, 2, .5) 0%, rgba(22, 16, 2, .12) 34%, transparent 62%);
}

.card__play {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 999px;
  background: rgba(253, 246, 228, .92);
  color: var(--text);
  box-shadow: 0 2px 10px rgba(20, 14, 2, .35);
  transition: transform .28s var(--ease), background .2s;
  z-index: 1;
}
.card:hover .card__play { transform: scale(1.08); }
.card__play svg { width: 18px; height: 18px; margin-left: 2px; }

.card__badge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(24, 18, 5, .82);
  color: #fff;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  z-index: 1;
}

.card__body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px 16px;
}

.card__title {
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.35;
}

.card__desc {
  color: var(--text-muted);
  font-size: 13.5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 12.5px;
}
.card__channel {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card__meta .dot { flex: none; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }

.tag {
  padding: 1px 8px;
  border-radius: 5px;
  background: var(--vanilla-deep);
  color: #2b2107;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .01em;
}

.card__tag {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 1;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(253, 246, 228, .93);
  color: #2b2107;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .01em;
  box-shadow: 0 2px 8px rgba(20, 14, 2, .28);
}

/* Row card (tests) */
.row {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: border-color .2s, background .2s, transform .2s var(--ease);
}
.row:hover { border-color: var(--border-strong); background: var(--bg-elevated); transform: translateX(2px); }

.row__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--vanilla-deep);
  color: #2b2107;
}
.row__icon svg { width: 19px; height: 19px; }
.row__main { flex: 1; min-width: 0; }
.row__title { display: block; font-weight: 600; letter-spacing: -.01em; }
.row__meta {
  display: block;
  color: var(--text-muted);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row__cta {
  flex: none;
  height: 34px;
  padding: 0 16px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  font-size: 13.5px;
  font-weight: 550;
  transition: background .18s, color .18s, border-color .18s;
}
.row:hover .row__cta { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

/* Empty state */
.empty {
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 72px 20px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--text-muted);
  text-align: center;
}
.empty strong { color: var(--text); font-weight: 600; }

/* ---------------------------------------------------------------
   Quiz player
   --------------------------------------------------------------- */
.player { max-width: 900px; }

.player__frame {
  display: block;
  width: 100%;
  height: min(74vh, 680px);
  margin-top: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

@media (max-width: 640px) {
  .player__frame { height: min(70vh, 520px); }
}

/* ---------------------------------------------------------------
   Test runner
   --------------------------------------------------------------- */
.runner { max-width: 720px; }

.runner__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.linkish {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-muted);
  font-weight: 550;
  cursor: pointer;
  transition: color .18s;
}
.linkish:hover { color: var(--text); }
.linkish svg { width: 16px; height: 16px; }

.runner__step {
  color: var(--text-muted);
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}

.runner__bar {
  height: 4px;
  border-radius: 999px;
  background: var(--cream-deep);
  overflow: hidden;
}
.runner__bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width .4s var(--ease);
}

.runner__q {
  margin: 24px 0 18px;
  font-size: clamp(19px, 2.4vw, 23px);
  font-weight: 650;
  line-height: 1.35;
  letter-spacing: -.02em;
}

.runner__options { display: grid; gap: 10px; }

.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .18s var(--ease);
}
.opt:hover { border-color: var(--border-strong); }
.opt:active { transform: scale(.995); }

.opt__letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--cream-deep);
  font-size: 12.5px;
  font-weight: 650;
  transition: background .18s, color .18s;
}

.opt[aria-pressed="true"] {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}
.opt[aria-pressed="true"] .opt__letter {
  background: var(--accent);
  color: var(--accent-text);
}

.runner__actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.btn {
  height: 40px;
  padding: 0 18px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 550;
  cursor: pointer;
  transition: background .18s, border-color .18s, opacity .18s;
}
.btn:hover { background: var(--bg-elevated); }
.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}
.btn--primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* --- results --- */
.score {
  display: flex;
  align-items: center;
  gap: 26px;
  margin: 10px 0 26px;
  padding: 22px 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.score__ring {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: conic-gradient(var(--ok) calc(var(--pct) * 1%), var(--cream-deep) 0);
}
.score__ring::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: var(--surface);
}
.score__num {
  position: relative;
  font-size: 27px;
  font-weight: 650;
  letter-spacing: -.03em;
}
.score__num small { font-size: 15px; font-weight: 550; color: var(--text-muted); }

.score__line { display: flex; align-items: center; gap: 9px; font-weight: 550; }
.score__dot { width: 9px; height: 9px; border-radius: 50%; }
.score__dot--ok { background: var(--ok); }
.score__dot--no { background: var(--no); }
.score__verdict { margin-top: 8px; color: var(--text-muted); font-size: 13.5px; }

.review {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.review__item {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.review__item.is-ok { border-color: color-mix(in srgb, var(--ok) 32%, var(--border)); }
.review__item.is-no { border-color: color-mix(in srgb, var(--no) 32%, var(--border)); }

.review__mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border-radius: 50%;
  color: #fff;
}
.review__mark svg { width: 13px; height: 13px; stroke-width: 3; }
.is-ok .review__mark { background: var(--ok); }
.is-no .review__mark { background: var(--no); }

.review__body { min-width: 0; }
.review__q { font-weight: 600; line-height: 1.4; margin-bottom: 7px; }
.review__answer {
  display: flex;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.5;
}
.review__answer + .review__answer { margin-top: 3px; }
.review__label {
  flex: none;
  width: 118px;
  padding-top: 2px;
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.review__answer--right { color: var(--ok); font-weight: 550; }
.review__answer--right .review__label { color: var(--ok); opacity: .75; }

@media (max-width: 640px) {
  .score { flex-direction: column; align-items: flex-start; gap: 18px; }
  .runner__actions { flex-direction: column-reverse; }
  .runner__actions .btn { width: 100%; }
  .review__answer { flex-direction: column; gap: 2px; }
  .review__label { width: auto; }
}

/* ---------------------------------------------------------------
   Footer
   --------------------------------------------------------------- */
.footer {
  padding: 28px 0 40px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 13px;
}

/* ---------------------------------------------------------------
   Responsive
   --------------------------------------------------------------- */
@media (max-width: 640px) {
  .header__inner, .tabs__inner, .main, .page-head, .filters, .footer > p {
    width: calc(100% - 32px);
  }
  .brand__text { display: none; }
  .search input { width: 150px; }
  .search input:focus { width: 190px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .row { flex-wrap: wrap; }
  .row__cta { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header">
    <div class="header__inner">
      <a class="brand" href="#/videos">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16v12H4z" /><path d="m10 10 5 2-5 2z" />
          </svg>
        </span>
        <span class="brand__text">English&nbsp;Media&nbsp;Lab</span>
      </a>

      <div class="header__actions">
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search library" />
        </div>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <div class="tabs__inner">
        <span class="tabs__indicator" aria-hidden="true"></span>
        <button class="tab" role="tab" data-tab="videos" aria-selected="true" aria-controls="main">Videos</button>
        <button class="tab" role="tab" data-tab="tests" aria-selected="false" aria-controls="main">Tests</button>
        <button class="tab" role="tab" data-tab="quizzes" aria-selected="false" aria-controls="main">Quizzes</button>
      </div>
    </nav>
  </header>

  <main id="main" class="main" role="tabpanel" tabindex="-1">
    <section class="page-head">
      <h1 id="page-title" class="page-head__title">Videos</h1>
      <p id="page-sub" class="page-head__sub">Short lessons to watch and learn from.</p>
    </section>

    <div id="filters" class="filters" role="group" aria-label="Filter by topic"></div>

    <div id="content" class="content"></div>
  </main>

  <footer class="footer">
    <p>English Media Lab — template build. Content coming next.</p>
  </footer>

/** Wordwall's own embed player, so the activity runs inside this page. */
const wordwallEmbed = (id) => `https://wordwall.net/embed/${id}`;


/* ---------------------------------------------------------------
   State
   --------------------------------------------------------------- */
const TABS = {
  videos:  { title: 'Videos',  sub: 'Short lessons to watch and learn from.' },
  tests:   { title: 'Tests',   sub: 'Five questions on one topic, scored as soon as you finish.' },
  quizzes: { title: 'Quizzes', sub: 'Interactive activities that play right here on the page.' },
};

const state = { tab: 'videos', query: '', topic: 'all', run: null, play: null };

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of [].concat(children)) {
    if (child) node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
};

const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
const countOf = (item) => (Array.isArray(item.questions) ? item.questions.length : item.questions);

const icon = (paths, attrs = '') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${attrs}>${paths}</svg>`;

/* ---------------------------------------------------------------
   Cards
   --------------------------------------------------------------- */
function videoCard(item) {
  const card = el('a', {
    className: 'card',
    href: youtubeWatchUrl(item.id),
    target: '_blank',
    rel: 'noopener noreferrer',
  });
  card.innerHTML = `
    <div class="card__thumb card__thumb--media">
      <img class="card__img" src="${youtubeThumb(item.id)}" alt="" loading="lazy"
           onerror="this.onerror=null;this.src='${youtubeThumbAlt(item.id)}'" />
      <span class="card__tag">${item.topic}</span>
      <span class="card__play">${icon('<path d="m9 7 9 5-9 5z" fill="currentColor" stroke="none" />')}</span>
      <span class="card__badge">${item.duration}</span>
    </div>
    <div class="card__body">
      <h3 class="card__title">${item.title}</h3>
      <p class="card__desc">${item.desc}</p>
      <div class="card__meta">
        <span class="card__channel">${item.channel}</span>
      </div>
    </div>`;
  return card;
}

function testRow(item) {
  const row = el('button', { className: 'row', type: 'button' });
  row.innerHTML = `
    <span class="row__icon">${icon('<path d="M9 5h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" /><path d="M10 10h4M10 14h4" />')}</span>
    <span class="row__main">
      <span class="row__title">${item.title}</span>
      <span class="row__meta">${item.topic} · ${countOf(item)} questions</span>
    </span>
    <span class="row__cta">Start</span>`;
  row.addEventListener('click', () => startTest(item));
  return row;
}

function quizCard(item) {
  const card = el('button', { className: 'card', type: 'button' });
  card.innerHTML = `
    <div class="card__thumb card__thumb--media" style="aspect-ratio:4/3">
      <img class="card__img" src="${item.thumb}" alt="" loading="lazy" />
      <span class="card__tag">${item.topic}</span>
      <span class="card__play">${icon('<path d="m9 7 9 5-9 5z" fill="currentColor" stroke="none" />')}</span>
    </div>
    <div class="card__body">
      <h3 class="card__title">${item.title}</h3>
      <div class="card__meta">
        <span class="tag">${item.type}</span>
      </div>
    </div>`;
  card.addEventListener('click', () => startQuiz(item));
  return card;
}

/* ---------------------------------------------------------------
   Render
   --------------------------------------------------------------- */
const datasets = { videos, tests, quizzes };

function matches(item) {
  const q = state.query.trim().toLowerCase();
  const byQuery = !q || `${item.title} ${item.desc ?? ''} ${item.topic} ${item.channel ?? ''} ${item.type ?? ''}`.toLowerCase().includes(q);
  const byTopic = state.topic === 'all' || item.topic === state.topic;
  return byQuery && byTopic;
}

/** Topics are read from the content itself, so a new entry adds its own chip. */
const topicsFor = (tab) => [...new Set(datasets[tab].map((item) => item.topic))].sort();

function renderFilters() {
  const wrap = $('#filters');
  wrap.replaceChildren();
  for (const value of ['all', ...topicsFor(state.tab)]) {
    const chip = el('button', { className: 'chip', type: 'button', textContent: value === 'all' ? 'All topics' : value });
    chip.setAttribute('aria-pressed', String(state.topic === value));
    chip.addEventListener('click', () => {
      state.topic = value;
      renderFilters();
      renderContent();
    });
    wrap.append(chip);
  }
}

function renderContent() {
  const content = $('#content');

  if (state.play) {
    content.replaceChildren(renderPlayer());
    return;
  }

  if (state.run) {
    content.replaceChildren(state.run.done ? renderResults() : renderQuestion());
    return;
  }

  const items = datasets[state.tab].filter(matches);
  content.replaceChildren();

  if (!items.length) {
    content.append(el('div', {
      className: 'empty',
      innerHTML: '<strong>Nothing here yet</strong><span>Try another topic or clear the search.</span>',
    }));
    return;
  }

  const grid = el('div', { className: state.tab === 'tests' ? 'grid grid--list' : 'grid' });
  const build = { videos: videoCard, tests: testRow, quizzes: quizCard }[state.tab];
  items.forEach((item) => grid.append(build(item)));
  content.append(grid);
}

/* ---------------------------------------------------------------
   Quiz player — the activity runs in the page, nothing navigates away
   --------------------------------------------------------------- */
function startQuiz(quiz) {
  state.play = quiz;
  renderTab();
  $('#main').scrollIntoView({ block: 'start' });
}

function exitQuiz() {
  state.play = null;
  renderTab();
}

function renderPlayer() {
  const quiz = state.play;
  const wrap = el('section', { className: 'player' });
  wrap.innerHTML = `
    <div class="runner__head">
      <button class="linkish" type="button" data-exit>${icon('<path d="M15 18l-6-6 6-6" />')} All quizzes</button>
      <span class="runner__step">${quiz.type}</span>
    </div>
    <iframe class="player__frame" src="${wordwallEmbed(quiz.id)}" title="${quiz.title}"
            allowfullscreen loading="lazy"></iframe>`;
  $('[data-exit]', wrap).addEventListener('click', exitQuiz);
  return wrap;
}

/* ---------------------------------------------------------------
   Test runner
   --------------------------------------------------------------- */
function startTest(test) {
  state.run = { test, index: 0, answers: Array(test.questions.length).fill(null), done: false };
  renderTab();
  $('#main').scrollIntoView({ block: 'start' });
}

function exitTest() {
  state.run = null;
  renderTab();
}

function answerButton(option, i, chosen) {
  const btn = el('button', { className: 'opt', type: 'button' });
  btn.setAttribute('aria-pressed', String(chosen === i));
  btn.innerHTML = `<span class="opt__letter">${LETTERS[i]}</span><span class="opt__text">${option}</span>`;
  btn.addEventListener('click', () => {
    state.run.answers[state.run.index] = i;
    renderContent();
  });
  return btn;
}

function renderQuestion() {
  const { test, index, answers } = state.run;
  const question = test.questions[index];
  const total = test.questions.length;
  const last = index === total - 1;

  const wrap = el('section', { className: 'runner' });
  wrap.innerHTML = `
    <div class="runner__head">
      <button class="linkish" type="button" data-exit>${icon('<path d="M15 18l-6-6 6-6" />')} All tests</button>
      <span class="runner__step">Question ${index + 1} of ${total}</span>
    </div>
    <div class="runner__bar"><span style="width:${(index / total) * 100}%"></span></div>
    <h2 class="runner__q">${question.q}</h2>
    <div class="runner__options"></div>
    <div class="runner__actions">
      <button class="btn" type="button" data-prev ${index === 0 ? 'hidden' : ''}>Back</button>
      <button class="btn btn--primary" type="button" data-next ${answers[index] === null ? 'disabled' : ''}>
        ${last ? 'Finish and see results' : 'Next question'}
      </button>
    </div>`;

  const options = $('.runner__options', wrap);
  question.options.forEach((option, i) => options.append(answerButton(option, i, answers[index])));

  $('[data-exit]', wrap).addEventListener('click', exitTest);
  $('[data-prev]', wrap).addEventListener('click', () => { state.run.index -= 1; renderContent(); });
  $('[data-next]', wrap).addEventListener('click', () => {
    if (last) state.run.done = true;
    else state.run.index += 1;
    renderContent();
  });
  return wrap;
}

function renderResults() {
  const { test, answers } = state.run;
  const total = test.questions.length;
  const correct = answers.filter((a, i) => a === test.questions[i].answer).length;
  const wrong = total - correct;
  const verdict = correct === total ? 'Every answer correct.'
    : correct >= total / 2 ? 'A solid result. Look over what you missed.'
    : 'Worth another go once you have reviewed the answers.';

  const wrap = el('section', { className: 'runner' });
  wrap.innerHTML = `
    <div class="runner__head">
      <button class="linkish" type="button" data-exit>${icon('<path d="M15 18l-6-6 6-6" />')} All tests</button>
    </div>

    <div class="score">
      <div class="score__ring" style="--pct:${(correct / total) * 100}">
        <span class="score__num">${correct}<small>/${total}</small></span>
      </div>
      <div class="score__side">
        <p class="score__line"><span class="score__dot score__dot--ok"></span>${correct} correct</p>
        <p class="score__line"><span class="score__dot score__dot--no"></span>${wrong} wrong</p>
        <p class="score__verdict">${verdict}</p>
      </div>
    </div>

    <ol class="review"></ol>

    <div class="runner__actions">
      <button class="btn" type="button" data-retry>Try again</button>
      <button class="btn btn--primary" type="button" data-exit>Back to tests</button>
    </div>`;

  const list = $('.review', wrap);
  test.questions.forEach((question, i) => {
    const given = answers[i];
    const ok = given === question.answer;
    const item = el('li', { className: `review__item ${ok ? 'is-ok' : 'is-no'}` });
    item.innerHTML = `
      <span class="review__mark">${ok
        ? icon('<path d="M20 6L9 17l-5-5" />')
        : icon('<path d="M6 6l12 12M18 6L6 18" />')}</span>
      <div class="review__body">
        <p class="review__q">${question.q}</p>
        <p class="review__answer">
          <span class="review__label">Your answer</span>
          ${given === null ? '<em>Not answered</em>' : `${LETTERS[given]}. ${question.options[given]}`}
        </p>
        ${ok ? '' : `<p class="review__answer review__answer--right">
          <span class="review__label">Correct answer</span>
          ${LETTERS[question.answer]}. ${question.options[question.answer]}
        </p>`}
      </div>`;
    list.append(item);
  });

  $$('[data-exit]', wrap).forEach((b) => b.addEventListener('click', exitTest));
  $('[data-retry]', wrap).addEventListener('click', () => startTest(test));
  return wrap;
}

function moveIndicator() {
  const active = $('.tab[aria-selected="true"]');
  const indicator = $('.tabs__indicator');
  if (!active || !indicator) return;
  indicator.style.width = `${active.offsetWidth}px`;
  indicator.style.transform = `translateX(${active.offsetLeft}px)`;
}

function renderTab() {
  const meta = TABS[state.tab];
  const run = state.run;
  const play = state.play;
  const focused = Boolean(run || play);

  $('#page-title').textContent = play ? play.title : run ? run.test.title : meta.title;
  $('#page-sub').textContent = play ? play.topic
    : run ? `${run.test.topic} · ${countOf(run.test)} questions`
    : meta.sub;
  document.title = `${play ? play.title : run ? run.test.title : meta.title} — English Media Lab`;

  $$('.tab').forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.tab === state.tab)));
  moveIndicator();

  $('#filters').hidden = focused;
  $('.search').hidden = focused;
  if (!focused) renderFilters();
  renderContent();
}

function setTab(tab, { pushHash = true } = {}) {
  if (!TABS[tab] || tab === state.tab) return;
  state.tab = tab;
  state.topic = 'all';
  state.run = null;
  state.play = null;
  if (pushHash) location.hash = `#/${tab}`;
  renderTab();
}

/* ---------------------------------------------------------------
   Wiring
   --------------------------------------------------------------- */
function init() {
  $$('.tab').forEach((tab) => {
    tab.addEventListener('click', () => setTab(tab.dataset.tab));
    tab.addEventListener('keydown', (e) => {
      const order = Object.keys(TABS);
      const i = order.indexOf(state.tab);
      if (e.key === 'ArrowRight') { setTab(order[(i + 1) % order.length]); $('.tab[aria-selected="true"]').focus(); }
      if (e.key === 'ArrowLeft')  { setTab(order[(i - 1 + order.length) % order.length]); $('.tab[aria-selected="true"]').focus(); }
    });
  });

  $('#search').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderContent();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (state.run || state.play)) { state.run = null; state.play = null; renderTab(); }
  });

  addEventListener('hashchange', () => setTab(location.hash.replace('#/', '') || 'videos', { pushHash: false }));
  addEventListener('resize', moveIndicator);

  const initial = location.hash.replace('#/', '');
  state.tab = TABS[initial] ? initial : 'videos';
  renderTab();
  requestAnimationFrame(moveIndicator);
}

init();
  </script>
</body>
</html>
